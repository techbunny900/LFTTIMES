<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | LFTimes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo-link">
        <img src="logo67.png" alt="LFTimes Logo" class="logo-img" />
      </a>
      <nav class="nav-links">
        <a href="articles.html" class="nav-btn">Articles</a>
        <a href="photos.html" class="nav-btn">Photos</a>
        <a href="about.html" class="nav-btn">About</a>
        <a href="calendar.html" class="nav-btn">Calendar</a>
      </nav>
    </div>
  </header>

  <!-- Dynamic Article Container -->
  <main class="main-content">
    <div class="about-container" id="articleContainer">
      <p class="loading-state">Loading article...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <img src="logo67.png" alt="LFTimes Logo" class="footer-logo" onerror="this.style.display='none'" />
        <p class="footer-tagline">The independent student newspaper of the Lycée Français de Toronto.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 LFTimes. All rights reserved.</p>
    </div>
  </footer>

  <!-- Supabase Script -->
  <script>
    const SUPABASE_URL = "https://glzgdwvxynwgfkcgpzmk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ghkX09WpI3Tt1ekca3qc7Q_HkaKkfMU";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    async function loadArticle() {
      const container = document.getElementById("articleContainer");

      if (!articleId) {
        container.innerHTML = "<h2>Article not found.</h2>";
        return;
      }

      const { data: art, error } = await _supabase
        .from('articles')
        .select('*')
        .eq('id', articleId)
        .single();

      if (error || !art) {
        console.error("Supabase article error:", error);
        container.innerHTML = "<h2>Article not found.</h2>";
        return;
      }

      document.title = `${art.title} | LFTimes`;

      const formattedDate = new Date(art.created_at).toLocaleDateString('en-US', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      container.innerHTML = `
        <article class="about-card">
          <div class="about-card-header">
            <span class="about-badge">${art.category || 'News'}</span>
            <h2>${art.title}</h2>
            <p class="card-date" style="margin-top:8px;">Published on ${formattedDate}</p>
          </div>

          ${art.image ? `<img src="${art.image}" alt="${art.title}" style="width:100%; border-radius:8px; margin: 20px 0;" />` : ''}

          <div class="about-text" style="line-height: 1.7; font-size: 1.1rem; margin-bottom: 30px;">
            <p>${art.content ? art.content.replace(/\n/g, '<br>') : 'No content available.'}</p>
          </div>

          <div class="author-signature">
            <span class="author-name">${art.author || 'LFTimes Team'}</span>
            <span class="author-title">${art.role || 'Staff Writer'}</span>
          </div>
        </article>
      `;
    }

    loadArticle();
  </script>
</body>
</html>

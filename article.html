<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | LFTimes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo-link"><img src="logo67.png" alt="LFTimes" class="logo-img"></a>
      <nav class="nav-links">
        <a href="articles.html" class="nav-btn">Articles</a>
        <a href="photos.html" class="nav-btn">Photos</a>
        <a href="about.html" class="nav-btn">À Propos</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="about-container" id="articleContainer">
      <p>Chargement de l'article...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "METS_TON_URL_ICI";
    const SUPABASE_KEY = "METS_TA_CLE_ANON_ICI";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    async function loadArticle() {
      const container = document.getElementById("articleContainer");

      if (!articleId) {
        container.innerHTML = "<h2>Article introuvable.</h2>";
        return;
      }

      const { data: art, error } = await _supabase
        .from('articles')
        .select('*')
        .eq('id', articleId)
        .single();

      if (error || !art) {
        container.innerHTML = "<h2>Article non trouvé.</h2>";
        return;
      }

      document.title = `${art.title} | LFTimes`;

      const formattedDate = new Date(art.created_at).toLocaleDateString('fr-FR', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      container.innerHTML = `
        <article class="about-card">
          <div class="about-card-header">
            <span class="about-badge">${art.category || 'News'}</span>
            <h2>${art.title}</h2>
            <p class="card-date">${formattedDate}</p>
          </div>
          ${art.image ? `<img src="${art.image}" alt="${art.title}" style="width:100%; border-radius:8px; margin: 20px 0;" />` : ''}
          <div class="about-text">
            <p>${art.content}</p>
          </div>
          <div class="author-signature">
            <span class="author-name">${art.author || 'Équipe LFTimes'}</span>
            <span class="author-title">${art.role || 'Rédacteur'}</span>
          </div>
        </article>
      `;
    }

    loadArticle();
  </script>
</body>
</html>
